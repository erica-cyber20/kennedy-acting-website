<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Welcome page for Kennedy's parent-managed young actress portfolio."
    >
    <title>Welcome | Kennedy Young Actress Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="opening-page">
    <a class="skip-link" href="#opening">Skip to welcome</a>

    <main class="opening" id="opening">
      <div class="opening-stage" aria-hidden="true">
        <span class="curtain curtain-left"></span>
        <span class="curtain curtain-right"></span>
        <span class="opening-light opening-light-one"></span>
        <span class="opening-light opening-light-two"></span>
        <span class="opening-star star-one"></span>
        <span class="opening-star star-two"></span>
        <span class="opening-star star-three"></span>
      </div>

      <section class="opening-content reveal visible" aria-labelledby="opening-title">
        <p class="eyebrow">Young actress portfolio</p>
        <h1 id="opening-title">Welcome to Kennedy's Creative Stage</h1>
        <p>
          Discover a young actress with a big imagination. Browse headshots, acting clips,
          resume highlights, and talent reels, with all inquiries safely managed by a parent.
        </p>
        <a class="button primary opening-button" href="main.html">
          Enter the Portfolio
        </a>
      </section>

      <aside class="opening-photo reveal visible" aria-label="Portfolio preview">
        <img src="assets/opening-portrait.jpg" alt="Kennedy smiling in a pink dress and white sneakers">
        <div class="opening-badge">
          <span>Acting</span>
          <span>Dance</span>
          <span>Storytelling</span>
        </div>
      </aside>
    </main>
  </body>
</html>
